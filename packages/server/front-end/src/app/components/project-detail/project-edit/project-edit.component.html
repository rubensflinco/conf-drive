<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <button class="btn btn-outline-secondary me-2" (click)="cancel()">
      <i class="bi bi-arrow-left"></i>
      <span class="btn-text">Voltar</span>
    </button>
    <h2>Editar Projeto</h2>
    <div>
      <button class="btn btn-danger" (click)="deleteProject()">
        <i class="bi bi-trash"></i> Excluir Projeto
      </button>
    </div>
  </div>

  <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

  <div class="card">
    <div class="card-body">
      <form (ngSubmit)="updateProject()" #projectForm="ngForm">
        <div class="mb-3">
          <label for="name" class="form-label">Nome do Projeto</label>
          <input
            type="text"
            class="form-control"
            id="name"
            name="name"
            [(ngModel)]="project.name"
            required
            #name="ngModel">
          <div class="invalid-feedback" *ngIf="name.invalid && (name.dirty || name.touched)">
            Nome do projeto é obrigatório
          </div>
        </div>

        <div class="mb-3">
          <label for="description" class="form-label">Descrição</label>
          <textarea
            class="form-control"
            id="description"
            name="description"
            [(ngModel)]="project.description"
            required
            rows="3"
            #description="ngModel"></textarea>
          <div class="invalid-feedback" *ngIf="description.invalid && (description.dirty || description.touched)">
            Descrição do projeto é obrigatória
          </div>
        </div>

        <div class="d-flex justify-content-end">
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="!isValidProject()">
            <i class="bi bi-save"></i> Salvar Alterações
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
